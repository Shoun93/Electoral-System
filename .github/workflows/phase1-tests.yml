name: Phase 1 unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/phase1-completion]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/ballot-validation-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn opencv-python-headless pyyaml
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
