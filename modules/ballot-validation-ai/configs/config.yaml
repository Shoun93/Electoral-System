# Cấu hình chung của pipeline. Đường dẫn tương đối với thư mục module.
labels: [valid, blank, erased, wrong_mark, multi_mark]

data:
  raw_dir: data/raw
  labels_csv: data/labels/all.csv
  boxes_json: data/labels/boxes.json
  processed_npz: data/processed/dataset.npz
  val_fraction: 0.125

preprocess:
  img_size: 224
  clahe_clip: 2.0

features:
  inner_margin: 5
  box_ink_threshold: 0.15

c45:
  max_depth: 6
  min_leaf: 5
  cf: 0.25

cnn:
  epochs: 15
  batch_size: 32
  lr: 0.001
  augment: true
  save_path: models/cnn_best.pt

mark_cnn:
  epochs: 25
  batch_size: 64
  lr: 0.001
  augment: true
  folds: 5
  seed: 42

decision:
  # PM policy not yet reconciled: no INVALID label set or acceptance threshold is assumed.
  acceptance_policy_approved: false
  invalid_labels: null
  nfr10_target: null
  coverage_min: null
  selective_risk_max: 0.02
  # OOF execution requires a separate explicit PM authorization.
  oof_selection_authorized: false
  tau_step: 0.01
  cv_folds: 5
  grid_min_leaf: [3, 5, 10, 20, 40, 80]
  grid_cf: [0.25, 0.1, 0.05, 0.01]
  grid_leaf_min_n: [0, 10, 20, 40, 60, 100, 150, 200]

cache:
  schema_version: 2
  seed: 42

hashchain:
  difficulty: 3

results_dir: results
models_dir: models
