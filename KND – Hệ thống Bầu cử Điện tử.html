<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KND – Hệ thống Bầu cử Điện tử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--red:#c4161c;--red2:#a30d13;--tint:#fceaea;--bg:#f6f6f9;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#d9dbe3;--ok:#15803d;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#d9262d;--red2:#8f0b10;--tint:#3b1c20;--bg:#14151a;--card:#1f2028;--ink:#f1f2f6;--mut:#9aa0ad;--line:#353742;color-scheme:dark}}
:root[data-theme="dark"]{--red:#d9262d;--red2:#8f0b10;--tint:#3b1c20;--bg:#14151a;--card:#1f2028;--ink:#f1f2f6;--mut:#9aa0ad;--line:#353742;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.hero{background:linear-gradient(135deg,#dd1b22,var(--red2));color:#fff;padding:28px 24px 28px;border-radius:0 0 36px 36px;box-shadow:0 12px 28px rgba(196,22,28,.22)}
.hero.home{border-radius:0;box-shadow:none;padding-bottom:64px;background:var(--red)}
.hero-in,.body-in{width:100%;max-width:560px;margin:0 auto}
.hero h1{margin:14px 0 4px;font-size:30px;line-height:1.15;font-weight:800}
.hero p{margin:0;opacity:.92}
.back{width:40px;height:40px;margin:-6px 0 0 -10px;display:grid;place-items:center;color:#fff;border-radius:50%}
.body{flex:1;padding:24px 20px 28px}
.body.pad-nav{padding-bottom:96px}
.stack{display:flex;flex-direction:column;gap:14px}
.in{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;font-size:16px}
textarea.in{min-height:110px;resize:vertical}
.in::placeholder{color:var(--mut)}
.lbl{font-weight:700;margin:6px 0 -4px}
.btn{width:100%;padding:16px;border-radius:18px;background:var(--red);color:#fff;font-weight:700;font-size:17px;box-shadow:0 8px 18px rgba(196,22,28,.28)}
.btn:hover{background:var(--red2)}
.btn.out{background:var(--card);color:var(--red);border:1.5px solid var(--red);box-shadow:none}
.btn.sm{width:auto;padding:12px 24px;border-radius:16px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}
.mut{color:var(--mut);text-align:center;margin:0}
.lnk{color:var(--red);font-weight:700;text-decoration:underline;font-size:inherit}
.card{background:var(--card);border-radius:22px;padding:20px;border:1px solid var(--line)}
.tag{display:inline-block;background:var(--tint);color:var(--red);font-weight:700;font-size:14px;padding:5px 12px;border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:21px;margin:8px 0 12px}
.verified{margin-top:-44px;display:flex;gap:16px;align-items:center;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.vic{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:14px;text-align:center}
.fn i{width:48px;height:48px;border-radius:14px;background:var(--tint);display:grid;place-items:center;color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button,.side button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:13px;font-weight:600}
.nav button{flex:1;padding:6px}
.nav button.on,.side button.on{color:var(--red)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.opt.on{background:var(--tint);border-color:var(--red)}
.opt b{display:block;margin-bottom:2px}.opt span{color:var(--mut)}
.cand{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px}
.cand.on{background:var(--tint);border-color:var(--red)}
.av{width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.cand div.t{flex:1}.cand b{font-size:18px;display:block}.cand small{color:var(--mut);font-size:15px}
.rad{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none}
.cand.on .rad{border-color:var(--red)}.cand.on .rad::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--red)}
.cin{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.cin .f{flex:1;display:flex;flex-direction:column;gap:8px}.cin .in{padding:11px 14px;border-radius:14px}
.cam{width:48px;height:48px;border-radius:50%;border:1.5px dashed var(--red);color:var(--red);display:grid;place-items:center;flex:none}
.x{color:var(--mut);width:36px;height:36px;font-size:20px}
.dash{width:100%;border:1.5px dashed var(--red);border-radius:18px;color:var(--red);font-weight:700;padding:16px;text-align:center;background:var(--card)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px 20px}
.center>*{max-width:520px;width:100%}
.big{width:104px;height:104px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 14px var(--tint)}
.code{background:var(--tint);border:2px dashed var(--red);border-radius:22px;padding:22px;color:var(--mut)}
.code b{display:block;color:var(--red);font-size:38px;font-weight:800;letter-spacing:1px}
.nfc{position:relative;width:min(100%,380px);margin:30px auto 10px;aspect-ratio:1.8;background:var(--tint);border:1.5px solid var(--red);border-radius:26px}
.nfc .chip{position:absolute;left:8%;top:10%;width:16%;height:22%;background:var(--red);border-radius:10px}
.nfc .ln{position:absolute;left:8%;height:7%;background:#f3b8b9;border-radius:8px}
.ring{position:absolute;right:-6%;top:50%;border-radius:50%;border:3px solid var(--red);opacity:.55;transform:translateY(-50%)}
.ring.a{width:34%;aspect-ratio:1}.ring.b{width:50%;aspect-ratio:1;opacity:.25}
.scanning .ring{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-50%) scale(1.12)}}
.ph{position:relative;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-weight:600;font-size:14px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#1f2937;color:#fff;font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sheet-bg{position:fixed;inset:0;background:rgba(15,16,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;text-align:center}
.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 20px;border-radius:14px;z-index:40;max-width:90vw;font-weight:600}
.splash{min-height:100vh;background:linear-gradient(180deg,#e01f26,#8f0b10);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;position:relative;overflow:hidden;width:100%;padding:24px}
.splash::before{content:"";position:absolute;top:-14vh;right:-20vw;width:90vw;max-width:700px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.07)}
.splash h1{font-size:30px;margin:10px 0 0;line-height:1.2;font-weight:800}.splash p{margin:0;font-size:18px}
.skyline{position:absolute;bottom:0;left:0;right:0;height:90px;opacity:.28}
.err{color:var(--red);font-weight:600;text-align:center;min-height:1.4em;margin:0}
.ep{display:flex;flex-direction:column;gap:12px}
.notif{display:flex;gap:14px;align-items:flex-start}.notif i{width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
@media (min-width:900px){
 .side{display:flex;flex-direction:column;gap:6px;width:240px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh}
 .side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--red);padding:0 10px 22px}
 .side button{flex-direction:row;gap:12px;padding:13px 14px;border-radius:14px;font-size:16px;justify-content:flex-start}
 .side button.on{background:var(--tint)}
 .nav{display:none}.body.pad-nav{padding-bottom:40px}
 .hero{border-radius:0 0 40px 40px;padding:36px 40px}.hero-in,.body-in{max-width:720px}
 .hero h1{font-size:36px}.body{padding:36px 40px}.hero.home{padding-bottom:72px}
 .grid4{gap:16px}.toast{bottom:40px}
 .sheet-bg{align-items:center}.sheet{border-radius:28px;max-width:480px}
}
@media (prefers-reduced-motion:reduce){.scanning .ring{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const I={
 back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 check:'<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 home:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10H3z"/></svg>',
 list:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 bell:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/></svg>',
 user:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
 plus:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 key:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>',
 cam:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>',
 img:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l6-5 4 3 3-2 3 3"/></svg>'
};
const logo=(w=96)=>`<svg width="${w}" height="${w*0.72}" viewBox="0 0 100 72" aria-label="KND"><path d="M30 2l24-2 6 18-8 3-6-1z" fill="#fff"/><rect x="36" y="6" width="14" height="3" rx="1.5" fill="#c4161c" opacity=".7"/><path d="M58 14l8 4-18 20-6-4z" fill="#fff"/><text x="2" y="68" font-family="Inter,Arial,sans-serif" font-weight="900" font-style="italic" font-size="52" fill="#fff" textLength="96" lengthAdjust="spacingAndGlyphs">KND</text></svg>`;
const S={screen:'splash',user:{name:'Nguyễn Văn A'},tab:'home',
 elections:[
  {id:'e1',code:'KND-7H2Q9X',name:'Bầu cử Đại diện Đoàn Thanh Niên HUTECH',type:'e',date:'15/11 – 20/11/2026',desc:'',cands:[['Nguyễn Văn A'],['Trần Thị B'],['Lê Văn C']],voted:false},
  {id:'e2',code:'KND-4M8R2T',name:'Bầu cử Ban cán sự lớp',type:'s',date:'10/11 – 18/11/2026',desc:'',cands:[],voted:false}],
 cur:null,pick:null,confirm:false,toast:'',nfcBusy:false,err:'',
 draft:{name:'',type:'e',from:'2026-11-17',to:'2026-11-22',desc:'',cands:[{n:'',d:''},{n:'',d:''}],imgs:['','','']},
 newCode:'',q:''};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{const[y,m,dd]=d.split('-');return dd+'/'+m};
const tagOf=e=>`<span class="tag">${e.type==='e'?'Bầu cử điện tử':'Quét giấy / ảnh'}</span>`;
const hero=(t,s,back,cls='')=>`<div class="hero ${cls}"><div class="hero-in">${cls.includes('logo')?logo(84):''}${back?`<button class="back" data-back="${back}" aria-label="Quay lại">${I.back}</button>`:''}<h1>${t}</h1><p>${s}</p></div></div>`;
const NAVS=[['home','Trang chủ',I.home],['list','Cuộc bầu cử',I.list],['notif','Thông báo',I.bell],['me','Cá nhân',I.user]];
function shell(inner,tab){
 const nav=NAVS.map(n=>`<button data-tab="${n[0]}" class="${tab===n[0]?'on':''}">${n[2]}<span>${n[1]}</span></button>`).join('');
 return `<aside class="side"><div class="brand"><svg width="40" height="29" viewBox="0 0 100 72"><text x="2" y="68" font-family="Inter,Arial" font-weight="900" font-style="italic" font-size="52" fill="currentColor" textLength="96" lengthAdjust="spacingAndGlyphs">KND</text></svg>Bầu cử</div>${nav}</aside><div class="main">${inner}</div><nav class="nav" aria-label="Điều hướng">${nav}</nav>`;
}
function elCard(e,btn){return `<div class="card ep"><div style="font-size:19px;font-weight:600">${esc(e.name)}</div><div>${tagOf(e)}</div><div class="row"><span style="color:var(--mut);font-size:17px">${e.date}</span>${btn}</div></div>`}
function joinBtn(e){return e.voted?`<span class="tag" style="background:var(--card);color:var(--ok)">Đã bỏ phiếu</span>`:`<button class="btn sm" data-join="${e.id}">Tham gia</button>`}
const V={
splash:()=>`<div class="splash">${logo(220)}<h1>Hệ thống<br>Bầu cử Điện tử</h1><p>Minh bạch – Công bằng – Hiện đại</p><svg class="skyline" viewBox="0 0 400 90" preserveAspectRatio="none" fill="#fff"><rect x="10" y="40" width="30" height="50"/><rect x="48" y="25" width="24" height="65"/><rect x="80" y="45" width="40" height="45"/><rect x="170" y="30" width="50" height="60"/><rect x="190" y="0" width="12" height="40"/><rect x="235" y="40" width="34" height="50"/><rect x="278" y="22" width="30" height="68"/><rect x="316" y="45" width="34" height="45"/><rect x="358" y="35" width="30" height="55"/></svg></div>`,
login:()=>`<div class="main">${hero('Đăng nhập','Tham gia hoặc tạo cuộc bầu cử của bạn','','logo')}<div class="body"><div class="body-in stack">
 <input class="in" id="u" placeholder="Email / Số điện thoại" autocomplete="username"><input class="in" id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password">
 <p class="err" id="err">${S.err}</p>
 <button class="btn" data-act="login">Đăng nhập</button><p class="mut">hoặc</p>
 <button class="btn out" data-go="nfc">Đăng nhập bằng CCCD (NFC)</button>
 <p class="mut">Chưa có tài khoản? <button class="lnk" data-go="register">Đăng ký</button></p></div></div></div>`,
register:()=>`<div class="main">${hero('Đăng ký','Tạo tài khoản để tham gia bầu cử','login','logo')}<div class="body"><div class="body-in stack">
 <input class="in" id="rn" placeholder="Họ và tên" autocomplete="name"><input class="in" id="rp" type="tel" placeholder="Số điện thoại"><input class="in" id="re" type="email" placeholder="Email"><input class="in" id="r1" type="password" placeholder="Mật khẩu"><input class="in" id="r2" type="password" placeholder="Xác nhận mật khẩu">
 <p class="err" id="err">${S.err}</p><button class="btn" data-act="register">Đăng ký</button>
 <p class="mut">Đã có tài khoản? <button class="lnk" data-go="login">Đăng nhập</button></p></div></div></div>`,
nfc:()=>`<div class="main">${hero('Xác thực CCCD','Bước cuối để xác minh danh tính của bạn','login')}<div class="body" style="display:flex"><div class="body-in" style="display:flex;flex-direction:column;justify-content:space-between;gap:20px">
 <div style="text-align:center"><div class="nfc ${S.nfcBusy?'scanning':''}"><div class="chip"></div><div class="ln" style="top:42%;width:46%"></div><div class="ln" style="top:56%;width:30%"></div><div class="ring b"></div><div class="ring a"></div></div>
 <h2 style="margin-top:28px">${S.nfcBusy?'Đang đọc thẻ…':'Sẵn sàng quét NFC'}</h2><p class="mut">Đặt CCCD gắn chip sát mặt lưng điện thoại và giữ yên trong vài giây</p></div>
 <div class="stack"><button class="btn" data-act="scan" ${S.nfcBusy?'disabled':''}>Bắt đầu quét</button><button class="btn out" data-go="login">Hủy bỏ</button></div></div></div></div>`,
home:()=>shell(`<div class="hero home"><div class="hero-in row"><div><div style="opacity:.92">Xin chào,</div><div style="font-size:26px;font-weight:800">${esc(S.user.name)}</div></div><button data-tab="notif" aria-label="Thông báo" style="color:#fff">${I.bell}</button></div></div>
 <div class="body pad-nav"><div class="body-in"><div class="verified"><div class="vic">${I.check.replace('48','30')}</div><div><b style="font-size:18px">Đã xác thực danh tính</b><div style="color:var(--mut)">Sẵn sàng tham gia bầu cử</div></div></div>
 <div class="row" style="margin-top:26px"><h2 style="margin:0">Cuộc bầu cử nổi bật</h2><button class="lnk" data-tab="list">Xem tất cả</button></div><div style="margin-top:12px">${elCard(S.elections[0],joinBtn(S.elections[0]))}</div>
 <h2 style="margin-top:26px">Các chức năng chính</h2><div class="grid4">
 <button class="fn" data-go="create"><i>${I.plus}</i>Tạo cuộc bầu cử</button><button class="fn" data-go="join"><i>${I.key}</i>Tham gia bằng mã</button><button class="fn" data-tab="list"><i>${I.list}</i>Danh sách bầu cử</button><button class="fn" data-tab="me"><i>${I.user}</i>Cá nhân</button></div></div></div>`,'home'),
list:()=>shell(`${hero('Cuộc bầu cử','Tất cả cuộc bầu cử bạn có thể tham gia','')}<div class="body pad-nav"><div class="body-in stack">${S.elections.map(e=>elCard(e,e.type==='e'?joinBtn(e):`<button class="btn sm out" data-join="${e.id}">Xem</button>`)).join('')}</div></div>`,'list'),
notif:()=>shell(`${hero('Thông báo','Cập nhật mới nhất','')}<div class="body pad-nav"><div class="body-in stack">
 <div class="card notif"><i></i><div><b>Bầu cử Đại diện Đoàn Thanh Niên HUTECH</b><div style="color:var(--mut)">Cuộc bầu cử đang diễn ra đến 20/11/2026. Hãy bỏ phiếu của bạn.</div></div></div>
 <div class="card notif"><i style="background:var(--ok)"></i><div><b>Danh tính đã được xác thực</b><div style="color:var(--mut)">Bạn có thể tham gia và tạo cuộc bầu cử.</div></div></div></div></div>`,'notif'),
me:()=>shell(`${hero('Cá nhân','Thông tin tài khoản','')}<div class="body pad-nav"><div class="body-in stack"><div class="card row"><div class="row" style="justify-content:flex-start;gap:16px"><div class="av">${esc(S.user.name.trim().split(' ').pop()[0]||'A')}</div><div><b style="font-size:18px">${esc(S.user.name)}</b><div style="color:var(--mut)">Đã xác thực CCCD</div></div></div></div><button class="btn out" data-go="login">Đăng xuất</button></div></div>`,'me'),
join:()=>`<div class="main">${hero('Tham gia cuộc bầu cử','Nhập mã hoặc tìm theo tên cuộc bầu cử','home')}<div class="body"><div class="body-in stack">
 <div class="lbl">Mã cuộc bầu cử</div><input class="in" id="code" placeholder="Ví dụ: KND-7H2Q9X" autocapitalize="characters"><p class="err" id="err" style="margin:-6px 0"></p>
 <button class="btn" data-act="joincode">Tham gia bằng mã</button><p class="mut">hoặc tìm theo tên</p>
 <input class="in" id="q" placeholder="Tìm tên cuộc bầu cử..." value="${esc(S.q)}"><div id="res" class="stack"></div></div></div></div>`,
create:()=>`<div class="main">${hero('Tạo cuộc bầu cử','Chọn hình thức và nhập thông tin','home')}<div class="body"><div class="body-in stack">
 <div class="lbl">Tên cuộc bầu cử</div><input class="in" id="cn" placeholder="Nhập tên cuộc bầu cử" value="${esc(S.draft.name)}">
 <div class="lbl">Hình thức</div>
 <button class="opt ${S.draft.type==='e'?'on':''}" data-type="e"><b>Bầu cử điện tử</b><span>Cử tri bỏ phiếu trực tiếp trên ứng dụng</span></button>
 <button class="opt ${S.draft.type==='s'?'on':''}" data-type="s"><b>Quét giấy / thêm file ảnh</b><span>Chụp hoặc tải ảnh phiếu bầu (JPG, PNG) để kiểm phiếu</span></button>
 <div class="lbl">Thời gian diễn ra</div><div class="row"><input class="in" type="date" id="d1" value="${S.draft.from}" aria-label="Ngày bắt đầu"><input class="in" type="date" id="d2" value="${S.draft.to}" aria-label="Ngày kết thúc"></div>
 <p class="err" id="err"></p><p class="mut">Mã cuộc bầu cử sẽ được tạo sau khi hoàn tất</p><button class="btn" data-act="next">Tiếp tục</button></div></div></div>`,
cevote:()=>`<div class="main">${hero('Bầu cử điện tử','Thêm mô tả và ứng cử viên','create')}<div class="body"><div class="body-in stack">
 <div class="lbl">Mô tả cuộc bầu cử</div><textarea class="in" id="desc" placeholder="Nhập mô tả...">${esc(S.draft.desc)}</textarea><div class="lbl">Ứng cử viên</div>
 ${S.draft.cands.map((c,i)=>`<div class="cin"><label class="cam" title="Thêm ảnh">${I.cam}<input type="file" accept="image/*" hidden></label><div class="f"><input class="in cn" data-i="${i}" placeholder="Tên ứng cử viên ${i+1}" value="${esc(c.n)}"><input class="in cd" data-i="${i}" placeholder="Mô tả ngắn (tùy chọn)" value="${esc(c.d)}"></div><button class="x" data-rm="${i}" aria-label="Xóa ứng cử viên ${i+1}">✕</button></div>`).join('')}
 <button class="dash" data-act="addc">+ Thêm ứng cử viên</button><p class="err" id="err"></p><button class="btn" data-act="finish">Tạo cuộc bầu cử</button></div></div></div>`,
cscan:()=>`<div class="main">${hero('Quét giấy / thêm ảnh','Chụp hoặc tải lên ảnh phiếu bầu','create')}<div class="body"><div class="body-in stack">
 <div class="grid4" style="grid-template-columns:1fr 1fr"><label class="opt on fn" style="color:var(--red);padding:22px"><span style="color:inherit">${I.cam}</span>Chụp ảnh scan<input type="file" accept="image/*" capture="environment" multiple hidden data-files></label><label class="opt fn" style="padding:22px;color:var(--ink)"><span style="color:var(--red)">${I.img}</span>Thêm file ảnh<input type="file" accept="image/jpeg,image/png" multiple hidden data-files></label></div>
 <div class="lbl">Ảnh đã thêm (${S.draft.imgs.length})</div><div class="g3">${S.draft.imgs.map((s,i)=>`<div class="ph">${s?`<img src="${s}" alt="Phiếu ${i+1}">`:I.img}<span style="position:relative">Phiếu ${i+1}</span><button class="x" data-rmi="${i}" aria-label="Xóa phiếu ${i+1}">✕</button></div>`).join('')}<label class="ph" style="border:1.5px dashed var(--red);color:var(--red);font-size:28px;cursor:pointer">+<input type="file" accept="image/jpeg,image/png" multiple hidden data-files></label></div>
 <p style="color:var(--mut);margin:0">Hỗ trợ JPG, PNG. Có thể thêm nhiều ảnh cùng lúc.</p><p class="err" id="err"></p><button class="btn" data-act="finish">Tạo cuộc bầu cử</button></div></div></div>`,
created:()=>`<div class="main"><div class="center"><div class="big">${I.check}</div><h1 style="font-size:30px;margin:8px 0 0">Tạo cuộc bầu cử thành công</h1><p class="mut" style="font-size:17px">Chia sẻ mã này để mọi người tham gia</p>
 <div class="code">Mã cuộc bầu cử<b>${S.newCode}</b></div><button class="btn" data-act="copy">Sao chép mã</button><button class="btn out" data-act="share">Chia sẻ</button></div>
 <p style="text-align:center;padding:0 0 32px"><button class="lnk" data-go="home" style="font-size:18px">Về trang chủ</button></p></div>`,
vote:()=>{const e=S.cur;if(e.type==='s')return `<div class="main">${hero(esc(e.name),e.date+' · Kiểm phiếu giấy / ảnh','home')}<div class="body"><div class="body-in"><div class="card">Cuộc bầu cử này kiểm phiếu từ ảnh phiếu giấy do người tổ chức tải lên. Cử tri không bỏ phiếu trên ứng dụng.</div></div></div></div>`;
 return `<div class="main">${hero(esc(e.name),e.date+' · Chọn 1 ứng cử viên','home')}<div class="body"><div class="body-in stack">
 ${e.cands.map((c,i)=>`<button class="cand ${S.pick===i?'on':''}" data-pick="${i}" role="radio" aria-checked="${S.pick===i}"><div class="av">${esc(c[0].trim().split(' ').pop()[0].toUpperCase())}</div><div class="t"><b>${esc(c[0])}</b><small>Ứng cử viên số ${i+1}${c[1]?' · '+esc(c[1]):''}</small></div><div class="rad"></div></button>`).join('')}
 <div style="height:8px"></div><button class="btn" data-act="review" ${S.pick===null?'disabled':''}>Xác nhận bỏ phiếu</button></div></div>
 ${S.confirm?`<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h3>Xác nhận lựa chọn của bạn</h3><div class="cand on" style="cursor:default"><div class="av">${esc(e.cands[S.pick][0].trim().split(' ').pop()[0].toUpperCase())}</div><div class="t"><b>${esc(e.cands[S.pick][0])}</b><small>Ứng cử viên số ${S.pick+1}</small></div></div><p class="mut">Phiếu bầu không thể thay đổi sau khi gửi.</p><button class="btn" data-act="cast">Xác nhận</button><button class="btn out" data-act="close">Chọn lại</button></div></div>`:''}</div>`},
done:()=>`<div class="main"><div class="center"><div class="big">${I.check}</div><h1 style="color:var(--red);font-size:30px;margin:10px 0 0">Bỏ phiếu thành công!</h1><p class="mut" style="font-size:17px">Cảm ơn bạn đã tham gia cuộc bầu cử.</p></div><div class="body" style="flex:none"><div class="body-in"><button class="btn" data-go="home">Quay về trang chủ</button></div></div></div>`
};
function go(s,opt={}){S.screen=s;S.err='';if(s==='home'||['list','notif','me'].includes(s))S.tab=s;if(opt.tab)S.tab=opt.tab;render();window.scrollTo(0,0)}
function render(){const v=V[S.screen]();$('#app').innerHTML=v;if(S.screen==='join')renderRes();if(S.screen==='splash')return}
function renderRes(){const q=(S.q||'').toLowerCase();const r=S.elections.filter(e=>e.name.toLowerCase().includes(q));$('#res').innerHTML=r.map(e=>`<button class="opt" data-join="${e.id}"><b>${esc(e.name)}</b>${tagOf(e)}</button>`).join('')||'<p class="mut">Không tìm thấy cuộc bầu cử phù hợp.</p>'}
function toast(t){S.toast=t;const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function open(id){const e=S.elections.find(x=>x.id===id);if(!e)return;if(e.voted){toast('Bạn đã bỏ phiếu cuộc bầu cử này');return}S.cur=e;S.pick=null;S.confirm=false;go('vote')}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return 'KND-'+c}
function readFiles(files){[...files].forEach(f=>{if(!/^image\/(jpeg|png)$/.test(f.type)){toast('Chỉ hỗ trợ ảnh JPG, PNG');return}const r=new FileReader();r.onload=()=>{S.draft.imgs.push(r.result);render()};r.readAsDataURL(f)})}
function saveCreate(){const el=id=>document.getElementById(id);if(el('desc'))S.draft.desc=el('desc').value}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){S.q=t.value;renderRes()}if(t.classList.contains('cn'))S.draft.cands[t.dataset.i].n=t.value;if(t.classList.contains('cd'))S.draft.cands[t.dataset.i].d=t.value;if(t.id==='desc')S.draft.desc=t.value;if(t.id==='cn')S.draft.name=t.value;if(t.id==='d1')S.draft.from=t.value;if(t.id==='d2')S.draft.to=t.value});
document.addEventListener('change',e=>{if(e.target.matches('[data-files]')){readFiles(e.target.files)}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-back],[data-tab],[data-join],[data-type],[data-pick],[data-act],[data-rm],[data-rmi]');
 if(!b){return}
 const d=b.dataset;
 if(d.act==='close'&&e.target.closest('.sheet')&&!b.classList.contains('btn')&&b.classList.contains('sheet-bg')){if(e.target!==b)return}
 if(d.go){if(d.go==='create'){S.draft={name:'',type:'e',from:'2026-11-17',to:'2026-11-22',desc:'',cands:[{n:'',d:''},{n:'',d:''}],imgs:['','','']}}go(d.go);return}
 if(d.back){go(S.screen==='cevote'||S.screen==='cscan'?'create':d.back);return}
 if(d.tab){go(d.tab);return}
 if(d.join){open(d.join);return}
 if(d.type){S.draft.type=d.type;render();return}
 if(d.pick!==undefined){S.pick=+d.pick;render();return}
 if(d.rm!==undefined){if(S.draft.cands.length>2){S.draft.cands.splice(+d.rm,1);render()}else toast('Cần ít nhất 2 ứng cử viên');return}
 if(d.rmi!==undefined){S.draft.imgs.splice(+d.rmi,1);render();return}
 const err=m=>{const x=$('#err');if(x)x.textContent=m};
 switch(d.act){
  case'login':{const u=$('#u').value.trim(),p=$('#p').value;if(!u||!p){err('Vui lòng nhập email/số điện thoại và mật khẩu');return}go('home');break}
  case'register':{const n=$('#rn').value.trim(),ph=$('#rp').value.trim(),em=$('#re').value.trim(),a=$('#r1').value,c=$('#r2').value;
   if(!n||!ph||!em||!a){err('Vui lòng điền đầy đủ thông tin');return}if(a.length<6){err('Mật khẩu cần ít nhất 6 ký tự');return}if(a!==c){err('Mật khẩu xác nhận không khớp');return}S.user.name=n;go('nfc');break}
  case'scan':S.nfcBusy=true;render();setTimeout(()=>{S.nfcBusy=false;go('home')},1800);break;
  case'joincode':{const c=$('#code').value.trim().toUpperCase();const el=S.elections.find(x=>x.code===c);if(!c){err('Vui lòng nhập mã cuộc bầu cử');return}if(!el){err('Không tìm thấy mã này. Kiểm tra lại và thử lần nữa.');return}open(el.id);break}
  case'next':{const n=$('#cn').value.trim();S.draft.name=n;if(!n){err('Vui lòng nhập tên cuộc bầu cử');return}if(S.draft.to<S.draft.from){err('Ngày kết thúc phải sau ngày bắt đầu');return}go(S.draft.type==='e'?'cevote':'cscan');break}
  case'addc':saveCreate();S.draft.cands.push({n:'',d:''});render();break;
  case'finish':{const D=S.draft;let cands=[];
   if(D.type==='e'){cands=D.cands.filter(c=>c.n.trim()).map(c=>[c.n.trim(),c.d.trim()]);if(cands.length<2){err('Nhập tên cho ít nhất 2 ứng cử viên');return}}
   else if(!D.imgs.length){err('Thêm ít nhất 1 ảnh phiếu bầu');return}
   S.newCode=genCode();S.elections.push({id:'e'+Date.now(),code:S.newCode,name:D.name,type:D.type,date:fmt(D.from)+' – '+fmt(D.to)+'/'+D.to.slice(0,4),desc:D.desc,cands,voted:false});go('created');break}
  case'copy':(navigator.clipboard?navigator.clipboard.writeText(S.newCode):Promise.reject()).then(()=>toast('Đã sao chép mã '+S.newCode),()=>toast('Không sao chép được. Hãy chép mã thủ công.'));break;
  case'share':{const t='Tham gia cuộc bầu cử với mã '+S.newCode;if(navigator.share)navigator.share({title:'KND',text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép nội dung chia sẻ'),()=>toast(t));else toast(t);break}
  case'review':if(S.pick!==null){S.confirm=true;render()}break;
  case'close':if(e.target===b||b.classList.contains('btn')){S.confirm=false;render()}break;
  case'cast':S.cur.voted=true;S.confirm=false;go('done');break;
 }
});
render();
setTimeout(()=>{if(S.screen==='splash')go('login')},2000);
</script>
</body>
</html>
